name: seed_app
description: A sustainability habit tracking app with gamified mascot system.
publish_to: 'none'  # Private app, not published to pub.dev
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  cached_network_image: ^3.3.1
  cloud_firestore: ^6.1.1
  connectivity_plus: ^7.0.0
  equatable: ^2.0.5
  firebase_analytics: ^12.1.0
  firebase_auth: ^6.1.3
  firebase_core: ^4.3.0
  firebase_crashlytics: ^5.0.7
  firebase_messaging: ^16.1.0
  firebase_storage: ^13.0.5
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  flutter_local_notifications: ^19.5.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_svg: ^2.0.10
  freezed_annotation: ^3.1.0
  go_router: ^17.0.1
  google_sign_in: ^7.2.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logger: ^2.4.0
  lottie: ^3.1.2
  markdown_widget: ^2.3.2
  package_info_plus: ^9.0.0
  purchases_flutter: ^9.10.6
  rive: ^0.14.1
  riverpod_annotation: ^3.0.0
  shared_preferences: ^2.2.3
  sign_in_with_apple: ^7.0.1
  timezone: ^0.10.1
  url_launcher: ^6.3.0
  uuid: ^4.4.2

dev_dependencies:
  build_runner: ^2.4.11
  fake_cloud_firestore: ^4.0.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  riverpod_generator: ^3.0.0
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true

  # ===================
  # Assets
  # ===================
  assets:
    - assets/images/
    - assets/images/mascot/
    - assets/images/sdg_infographics/
    - assets/icons/
    - assets/animations/
    - assets/data/

  # ===================
  # Fonts (add custom fonts here)
  # ===================
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
  #       - asset: assets/fonts/CustomFont-Bold.ttf
  #         weight: 700

  generate: true  # Enable code generation for localization

# ===================
# Dependency Notes
# ===================
#
# This is similar to pyproject.toml in Python:
#   - `dependencies` = production dependencies
#   - `dev_dependencies` = development-only (testing, codegen, linting)
#
# Common commands (like poetry):
#   flutter pub get          # Install dependencies (like: poetry install)
#   flutter pub upgrade      # Upgrade dependencies (like: poetry update)
#   flutter pub outdated     # Check for updates (like: poetry show --outdated)
#   flutter pub deps         # Show dependency tree (like: poetry show --tree)
#
# Code generation (run after modifying freezed/riverpod classes):
#   dart run build_runner build --delete-conflicting-outputs
#
# Or use watch mode during development:
#   dart run build_runner watch --delete-conflicting-outputs
