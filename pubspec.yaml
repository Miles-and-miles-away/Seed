name: seed_app
description: A sustainability habit tracking app with gamified mascot system.
publish_to: 'none'  # Private app, not published to pub.dev
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  cached_network_image: ^3.3.1
  cloud_firestore: ^6.1.1
  cloud_functions: ^6.3.2
  collection: ^1.19.0
  firebase_analytics: ^12.1.0
  firebase_app_check: ^0.4.1+4
  firebase_auth: ^6.1.3
  firebase_core: ^4.3.0
  firebase_crashlytics: ^5.0.7
  firebase_messaging: ^16.1.0
  firebase_performance: ^0.11.1+4
  firebase_storage: ^13.0.5
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  flutter_local_notifications: ^21.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_svg: ^2.0.10
  freezed_annotation: ^3.1.0
  go_router: ^17.0.1
  google_sign_in: ^7.2.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  markdown_widget: ^2.3.2
  package_info_plus: ^10.1.0
  rive: ^0.14.1
  riverpod_annotation: ^4.0.2
  sign_in_with_apple: ^8.1.0
  timezone: ^0.11.0
  url_launcher: ^6.3.0

dev_dependencies:
  build_runner: ^2.4.11
  fake_cloud_firestore: ^4.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  riverpod_generator: ^4.0.3
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true

  # ===================
  # Assets
  # ===================
  assets:
    - assets/images/
    - assets/images/mascot/
    - assets/images/sdg_progress/
    - assets/icons/
    - assets/animations/
    - assets/eco_dex/
    - data/app/

  # ===================
  # Fonts (add custom fonts here)
  # ===================
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
  #       - asset: assets/fonts/CustomFont-Bold.ttf
  #         weight: 700

  generate: true  # Enable code generation for localization

# ===================
# App launcher icons (dart run flutter_launcher_icons)
# ===================
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  image_path_ios_dark_transparent: assets/icon/app_icon_dark.png
  image_path_ios_tinted_grayscale: assets/icon/app_icon_tinted.png

  android: true
  min_sdk_android: 24
  adaptive_icon_background: "#282828"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_foreground_inset: 0

  ios: true
  remove_alpha_ios: true

# ===================
# Dependency Notes
# ===================
#
# This is similar to pyproject.toml in Python:
#   - `dependencies` = production dependencies
#   - `dev_dependencies` = development-only (testing, codegen, linting)
#
# Common commands (like poetry):
#   flutter pub get          # Install dependencies (like: poetry install)
#   flutter pub upgrade      # Upgrade dependencies (like: poetry update)
#   flutter pub outdated     # Check for updates (like: poetry show --outdated)
#   flutter pub deps         # Show dependency tree (like: poetry show --tree)
#
# Code generation (run after modifying freezed/riverpod classes):
#   dart run build_runner build
#
# Or use watch mode during development:
#   dart run build_runner watch
