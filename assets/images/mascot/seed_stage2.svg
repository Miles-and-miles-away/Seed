<svg viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for shiny seed body -->
    <radialGradient id="seedGradient" cx="45%" cy="40%">
      <stop offset="0%" style="stop-color:#A89070;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B6F47;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B5535;stop-opacity:1" />
    </radialGradient>
    
    <!-- Eye gradient -->
    <radialGradient id="eyeGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#5C9FFF;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#3A7FE8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563C8;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Seed body with gradient -->
  <ellipse cx="100" cy="120" rx="62" ry="82" fill="url(#seedGradient)" stroke="#5C4A33" stroke-width="2.5"/>
  
  <!-- Seed shine highlight -->
  <ellipse cx="85" cy="85" rx="25" ry="35" fill="#FFFFFF" opacity="0.25"/>
  
  <!-- Seed texture lines (subtle) -->
  <path d="M 70 90 Q 100 95 130 90" fill="none" stroke="#6B5535" stroke-width="1.5" opacity="0.3"/>
  <path d="M 65 110 Q 100 115 135 110" fill="none" stroke="#6B5535" stroke-width="1.5" opacity="0.3"/>
  <path d="M 70 130 Q 100 135 130 130" fill="none" stroke="#6B5535" stroke-width="1.5" opacity="0.3"/>
  
  <!-- ANIME EYES (much bigger and more detailed) -->
  <!-- Left eye white -->
  <ellipse cx="78" cy="100" rx="22" ry="28" fill="#FFFFFF" stroke="#2C1810" stroke-width="2.5"/>
  <!-- Right eye white -->
  <ellipse cx="122" cy="100" rx="22" ry="28" fill="#FFFFFF" stroke="#2C1810" stroke-width="2.5"/>
  
  <!-- Left iris -->
  <ellipse cx="78" cy="105" rx="16" ry="20" fill="url(#eyeGradient)"/>
  <!-- Right iris -->
  <ellipse cx="122" cy="105" rx="16" ry="20" fill="url(#eyeGradient)"/>
  
  <!-- Left pupil -->
  <ellipse cx="78" cy="107" rx="7" ry="10" fill="#1A1A2E"/>
  <!-- Right pupil -->
  <ellipse cx="122" cy="107" rx="7" ry="10" fill="#1A1A2E"/>
  
  <!-- Main eye highlights (large anime style) -->
  <ellipse cx="72" cy="95" rx="8" ry="10" fill="#FFFFFF" opacity="0.9"/>
  <ellipse cx="116" cy="95" rx="8" ry="10" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Secondary smaller highlights -->
  <circle cx="82" cy="113" r="4" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="126" cy="113" r="4" fill="#FFFFFF" opacity="0.7"/>
  
  <!-- Tiny sparkle highlights -->
  <circle cx="85" cy="93" r="2" fill="#FFFFFF"/>
  <circle cx="129" cy="93" r="2" fill="#FFFFFF"/>
  
  <!-- Eye shine lines (anime style) -->
  <path d="M 70 90 L 68 87" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 114 90 L 112 87" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Rosy cheeks (more vibrant) -->
  <ellipse cx="55" cy="115" rx="13" ry="9" fill="#FF9EAA" opacity="0.7"/>
  <ellipse cx="145" cy="115" rx="13" ry="9" fill="#FF9EAA" opacity="0.7"/>
  
  <!-- Small anime-style mouth -->
  <path d="M 95 130 Q 100 133 105 130" fill="#8B4A47" stroke="#5C4A33" stroke-width="1.5"/>
  
  <!-- Little sprout on top (more dynamic) -->
  <path d="M 100 40 Q 102 30 108 23 Q 112 17 110 11" fill="none" stroke="#6B8E23" stroke-width="5" stroke-linecap="round"/>
  <path d="M 100 40 Q 98 30 92 23 Q 88 17 90 11" fill="none" stroke="#6B8E23" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Leaves on sprout (more vibrant) -->
  <ellipse cx="110" cy="11" rx="10" ry="14" fill="#8BC34A" stroke="#689F38" stroke-width="2" transform="rotate(25 110 11)"/>
  <ellipse cx="90" cy="11" rx="10" ry="14" fill="#8BC34A" stroke="#689F38" stroke-width="2" transform="rotate(-25 90 11)"/>
  
  <!-- Leaf highlights -->
  <ellipse cx="108" cy="7" rx="4" ry="6" fill="#AED581" opacity="0.6" transform="rotate(25 108 7)"/>
  <ellipse cx="92" cy="7" rx="4" ry="6" fill="#AED581" opacity="0.6" transform="rotate(-25 92 7)"/>
  
  <!-- LONGER ARMS WITH FINGER BUDS -->
  <!-- Left arm -->
  <path d="M 42 130 Q 28 135 20 145" fill="none" stroke="#5C4A33" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Left hand finger buds -->
  <circle cx="18" cy="148" r="4" fill="#7CB342" stroke="#558B2F" stroke-width="1.5"/>
  <circle cx="20" cy="152" r="4" fill="#7CB342" stroke="#558B2F" stroke-width="1.5"/>
  <circle cx="16" cy="152" r="4" fill="#7CB342" stroke="#558B2F" stroke-width="1.5"/>
  
  <!-- Right arm -->
  <path d="M 158 130 Q 172 135 180 145" fill="none" stroke="#5C4A33" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Right hand finger buds -->
  <circle cx="182" cy="148" r="4" fill="#7CB342" stroke="#558B2F" stroke-width="1.5"/>
  <circle cx="180" cy="152" r="4" fill="#7CB342" stroke="#558B2F" stroke-width="1.5"/>
  <circle cx="184" cy="152" r="4" fill="#7CB342" stroke="#558B2F" stroke-width="1.5"/>
  
  <!-- ROOTLETS at the bottom -->
  <!-- Center root -->
  <path d="M 100 202 Q 100 215 98 225" fill="none" stroke="#8B7355" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Left roots -->
  <path d="M 85 200 Q 75 210 70 220" fill="none" stroke="#8B7355" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 92 202 Q 85 212 82 222" fill="none" stroke="#8B7355" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Right roots -->
  <path d="M 115 200 Q 125 210 130 220" fill="none" stroke="#8B7355" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 108 202 Q 115 212 118 222" fill="none" stroke="#8B7355" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Small root hairs -->
  <path d="M 70 220 L 68 223" fill="none" stroke="#8B7355" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <path d="M 72 218 L 70 221" fill="none" stroke="#8B7355" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <path d="M 130 220 L 132 223" fill="none" stroke="#8B7355" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <path d="M 128 218 L 130 221" fill="none" stroke="#8B7355" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <path d="M 98 225 L 96 228" fill="none" stroke="#8B7355" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <path d="M 100 226 L 102 229" fill="none" stroke="#8B7355" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
</svg>