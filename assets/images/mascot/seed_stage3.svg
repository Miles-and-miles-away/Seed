<svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for shiny seed body -->
    <radialGradient id="seedGradient" cx="45%" cy="40%">
      <stop offset="0%" style="stop-color:#A89070;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B6F47;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B5535;stop-opacity:1" />
    </radialGradient>
    
    <!-- Eye gradient -->
    <radialGradient id="eyeGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#5C9FFF;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#3A7FE8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563C8;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- THICKER LEGS -->
  <!-- Left leg -->
  <path d="M 80 195 L 70 240" fill="none" stroke="#5C4A33" stroke-width="10" stroke-linecap="round"/>
  <!-- Right leg -->
  <path d="M 120 195 L 130 240" fill="none" stroke="#5C4A33" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Seed body with gradient -->
  <ellipse cx="100" cy="115" rx="65" ry="85" fill="url(#seedGradient)" stroke="#5C4A33" stroke-width="2.5"/>
  
  <!-- Seed shine highlight -->
  <ellipse cx="85" cy="80" rx="28" ry="38" fill="#FFFFFF" opacity="0.25"/>
  
  <!-- Seed texture lines (subtle) -->
  <path d="M 70 85 Q 100 90 130 85" fill="none" stroke="#6B5535" stroke-width="1.5" opacity="0.3"/>
  <path d="M 65 105 Q 100 110 135 105" fill="none" stroke="#6B5535" stroke-width="1.5" opacity="0.3"/>
  <path d="M 70 125 Q 100 130 130 125" fill="none" stroke="#6B5535" stroke-width="1.5" opacity="0.3"/>
  
  <!-- MORE MATURE ANIME EYES (slightly smaller, more refined) -->
  <!-- Left eye white -->
  <ellipse cx="78" cy="95" rx="20" ry="24" fill="#FFFFFF" stroke="#2C1810" stroke-width="2.5"/>
  <!-- Right eye white -->
  <ellipse cx="122" cy="95" rx="20" ry="24" fill="#FFFFFF" stroke="#2C1810" stroke-width="2.5"/>
  
  <!-- Left iris -->
  <ellipse cx="78" cy="99" rx="14" ry="18" fill="url(#eyeGradient)"/>
  <!-- Right iris -->
  <ellipse cx="122" cy="99" rx="14" ry="18" fill="url(#eyeGradient)"/>
  
  <!-- Left pupil -->
  <ellipse cx="78" cy="101" rx="6" ry="9" fill="#1A1A2E"/>
  <!-- Right pupil -->
  <ellipse cx="122" cy="101" rx="6" ry="9" fill="#1A1A2E"/>
  
  <!-- Main eye highlights (large anime style) -->
  <ellipse cx="73" cy="91" rx="7" ry="9" fill="#FFFFFF" opacity="0.9"/>
  <ellipse cx="117" cy="91" rx="7" ry="9" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Secondary smaller highlights -->
  <circle cx="82" cy="107" r="3.5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="126" cy="107" r="3.5" fill="#FFFFFF" opacity="0.7"/>
  
  <!-- Tiny sparkle highlights -->
  <circle cx="84" cy="89" r="2" fill="#FFFFFF"/>
  <circle cx="128" cy="89" r="2" fill="#FFFFFF"/>
  
  <!-- Eye shine lines (anime style) -->
  <path d="M 71 86 L 69 83" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 115 86 L 113 83" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Rosy cheeks (subtle for more mature look) -->
  <ellipse cx="55" cy="110" rx="12" ry="8" fill="#FF9EAA" opacity="0.5"/>
  <ellipse cx="145" cy="110" rx="12" ry="8" fill="#FF9EAA" opacity="0.5"/>
  
  <!-- More mature smile -->
  <path d="M 88 125 Q 100 130 112 125" fill="none" stroke="#5C4A33" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Bigger stem on top -->
  <path d="M 100 30 L 100 15" fill="none" stroke="#6B8E23" stroke-width="6" stroke-linecap="round"/>
  
  <!-- BIGGER LEAF-SHAPED LEAVES -->
  <!-- Left leaf -->
  <path d="M 100 15 Q 70 10 60 25 Q 55 35 65 40 Q 80 42 100 35" fill="#8BC34A" stroke="#689F38" stroke-width="2.5"/>
  <!-- Left leaf vein -->
  <path d="M 100 15 Q 75 20 65 35" fill="none" stroke="#689F38" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Right leaf -->
  <path d="M 100 15 Q 130 10 140 25 Q 145 35 135 40 Q 120 42 100 35" fill="#8BC34A" stroke="#689F38" stroke-width="2.5"/>
  <!-- Right leaf vein -->
  <path d="M 100 15 Q 125 20 135 35" fill="none" stroke="#689F38" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Leaf highlights -->
  <ellipse cx="70" cy="25" rx="8" ry="10" fill="#AED581" opacity="0.4" transform="rotate(-20 70 25)"/>
  <ellipse cx="130" cy="25" rx="8" ry="10" fill="#AED581" opacity="0.4" transform="rotate(20 130 25)"/>
  
  <!-- THICKER ARMS -->
  <!-- Left arm -->
  <path d="M 40 120 Q 25 125 15 135" fill="none" stroke="#5C4A33" stroke-width="9" stroke-linecap="round"/>
  
  <!-- Left hand with leaf/grass-like fingers -->
  <path d="M 15 135 Q 11 140 10 145" fill="#7CB342" stroke="#558B2F" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 15 135 Q 12 141 12 147" fill="#7CB342" stroke="#558B2F" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 15 135 Q 14 141 15 148" fill="#7CB342" stroke="#558B2F" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Right arm - BENT UPWARD -->
  <path d="M 160 120 Q 175 110 185 95" fill="none" stroke="#5C4A33" stroke-width="9" stroke-linecap="round"/>
  
  <!-- Right hand with thumbs up gesture -->
  <!-- Curled fingers (fist) - curling outward and slightly up -->
  <path d="M 185 95 Q 190 93 194 92" fill="#7CB342" stroke="#558B2F" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 185 95 Q 191 95 195 96" fill="#7CB342" stroke="#558B2F" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Thumb pointing up -->
  <path d="M 185 95 Q 192 92 195 85" fill="#7CB342" stroke="#558B2F" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Feet at bottom of legs -->
  <ellipse cx="70" cy="242" rx="8" ry="5" fill="#5C4A33"/>
  <ellipse cx="130" cy="242" rx="8" ry="5" fill="#5C4A33"/>
</svg>