# Art Pipeline Configuration
# Shared settings for generate -> validate -> review -> optimize

# Recraft API
recraft:
  # Set RECRAFT_API_TOKEN env var before running
  api_url: "https://external.api.recraft.ai/v1/images/generations"
  candidates_per_asset: 3
  response_format: "b64_json"
  size: "1:1"
  units_per_svg: 80
  monthly_unit_budget: 5000
  # 1000 units = $1. recraftv4_vector = 80 units/image.
  # Check balance: curl -s -H "Authorization: Bearer $RECRAFT_API_TOKEN" \
  #   https://external.api.recraft.ai/v1/users/me | python3 -m json.tool

# Art style
# Prompt structure follows Recraft recommendation:
#   {artPrompt}, {category suffix}, {style suffix}
# Controls (colors, background, no_text) are sent via API params,
# NOT in the prompt text. See generate.py build_payload().
style:
  # Style description appended AFTER the subject + category
  suffix: >-
    simple flat vector illustration, minimal geometric style,
    cute rounded shapes, natural tones, centered composition,
    single subject, no gradients, no shadows, no texture,
    no text, no labels, no lettering
  categories:
    # Eco-Dex categories
    climate: ""
    oceans: "ocean or marine scene, underwater or coastal"
    food_systems: "food or agriculture concept, organic"
    biodiversity: "wildlife or ecosystem scene, natural diversity"
    energy: "energy or technology concept, clean and modern"
    circular_economy: "waste or recycling concept, circular flow"
    people_planet: "humanity and sustainability, social impact"
    your_journey: "personal growth metaphor, inspirational"
    hidden_gems: "achievement badge or reward symbol, special"
    # Other asset categories
    flora: "botanical plant illustration, single specimen"
    fauna: "friendly animal character, simple features"
    elements: "natural element icon, symbolic"
    sdg_world: "globe or world concept, sustainability themed"
    eco_pioneers: "human figure, minimalist, diverse"
    milestones: "achievement symbol, celebratory"
    challenge: "action or activity symbol, energetic"
    garden: "garden plant with pot or soil, growth stages"
    mascot: "cute mascot character, kawaii inspired, expressive"

