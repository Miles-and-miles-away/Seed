version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: pub
    directory: /
    target-branch: development
    schedule:
      interval: monthly
    groups:
      pub:
        patterns:
          - "*"
    ignore:
      # flutter_localizations pins intl to an exact version
      - dependency-name: intl

  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: monthly
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /functions
    target-branch: development
    schedule:
      interval: monthly
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # ts-jest 29 caps its typescript peer at <7
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # firebase-admin 14 is ESM-only; the jest CJS transform can't load it
      - dependency-name: firebase-admin
        update-types: ["version-update:semver-major"]
