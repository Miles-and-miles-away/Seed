name: Merge Guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-branch:
    name: Source Branch Guard
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      # head_ref is untrusted input, so it goes through env, never inline.
      - env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "development" ]; then
            echo "::error::Only 'development' may merge into main." \
                 "This PR is from '$HEAD_REF'. Retarget it at development."
            exit 1
          fi
