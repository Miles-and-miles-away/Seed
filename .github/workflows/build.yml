name: Build Verification

on:
  pull_request:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.x"
          cache: true

      - name: Create Firebase options stub
        run: |
          cat > lib/firebase_options.dart << 'DART'
          // ignore_for_file: type=lint
          import 'package:firebase_core/firebase_core.dart'
              show FirebaseOptions;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              return const FirebaseOptions(
                apiKey: 'stub',
                appId: 'stub',
                messagingSenderId: 'stub',
                projectId: 'stub',
              );
            }
          }
          DART

      # google-services.json is gitignored; the Google Services Gradle
      # plugin only bakes these values into string resources, so stubs
      # are fine for build verification.
      - name: Create google-services.json stub
        run: |
          cat > android/app/google-services.json << 'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "seed-stub",
              "storage_bucket": "seed-stub.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.seedapp" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "stub" }],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - run: flutter pub get

      # Generated files (.g.dart, .freezed.dart, l10n/generated/) are
      # committed to the repo, so codegen does not run in CI. Run
      # `flutter pub run build_runner build` and `flutter gen-l10n`
      # locally after editing `@riverpod`/`@freezed` classes or ARB files.

      - name: Build debug APK
        run: flutter build apk --debug
