name: Build Verification

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.x"
          cache: true

      - name: Create Firebase options stub
        run: |
          cat > lib/firebase_options.dart << 'DART'
          // ignore_for_file: type=lint
          import 'package:firebase_core/firebase_core.dart'
              show FirebaseOptions;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              return const FirebaseOptions(
                apiKey: 'stub',
                appId: 'stub',
                messagingSenderId: 'stub',
                projectId: 'stub',
              );
            }
          }
          DART

      # google-services.json is gitignored; the Google Services Gradle
      # plugin only bakes these values into string resources, so stubs
      # are fine for build verification.
      - name: Create google-services.json stub
        run: |
          cat > android/app/google-services.json << 'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "seed-stub",
              "storage_bucket": "seed-stub.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.seedapp" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "stub" }],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - run: flutter pub get

      # Generated files (.g.dart, .freezed.dart, l10n/generated/) are
      # committed to the repo, so codegen does not run in CI. Run
      # `flutter pub run build_runner build` and `flutter gen-l10n`
      # locally after editing `@riverpod`/`@freezed` classes or ARB files.

      - name: Build debug APK
        run: flutter build apk --debug

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.x"
          cache: true

      - name: Create Firebase options stub
        run: |
          cat > lib/firebase_options.dart << 'DART'
          // ignore_for_file: type=lint
          import 'package:firebase_core/firebase_core.dart'
              show FirebaseOptions;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              return const FirebaseOptions(
                apiKey: 'stub',
                appId: 'stub',
                messagingSenderId: 'stub',
                projectId: 'stub',
              );
            }
          }
          DART

      # GoogleService-Info.plist is gitignored but the Xcode project copies
      # it in as a bundled resource, so the build needs the file to exist,
      # not to hold real credentials.
      - name: Create GoogleService-Info.plist stub
        run: |
          cat > ios/Runner/GoogleService-Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>GCM_SENDER_ID</key><string>000000000000</string>
            <key>PLIST_VERSION</key><string>1</string>
            <key>BUNDLE_ID</key><string>com.seedapp.seedApp</string>
            <key>PROJECT_ID</key><string>seed-stub</string>
            <key>STORAGE_BUCKET</key><string>seed-stub.appspot.com</string>
            <key>GOOGLE_APP_ID</key>
            <string>1:000000000000:ios:0000000000000000</string>
            <key>IS_ADS_ENABLED</key><false/>
            <key>IS_ANALYTICS_ENABLED</key><false/>
            <key>IS_APPINVITE_ENABLED</key><true/>
            <key>IS_GCM_ENABLED</key><true/>
            <key>IS_SIGNIN_ENABLED</key><true/>
          </dict>
          </plist>
          PLIST

      - run: flutter pub get

      # Simulator, not device: --no-codesign still builds for device, which
      # needs a Development Team the project has no reason to configure in
      # CI. A simulator build compiles the same Dart and plugin code and
      # needs no signing at all.
      - name: Build iOS for the simulator
        run: flutter build ios --simulator --debug
