name: Analyze & Test

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.x"
          cache: true

      - name: Create Firebase options stub
        run: |
          cat > lib/firebase_options.dart << 'DART'
          // ignore_for_file: type=lint
          import 'package:firebase_core/firebase_core.dart'
              show FirebaseOptions;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              return const FirebaseOptions(
                apiKey: 'stub',
                appId: 'stub',
                messagingSenderId: 'stub',
                projectId: 'stub',
              );
            }
          }
          DART

      - run: flutter pub get

      # Generated files (.g.dart, .freezed.dart, l10n/generated/) are
      # committed to the repo, so codegen does not run in CI. Run
      # `flutter pub run build_runner build` and `flutter gen-l10n`
      # locally after editing `@riverpod`/`@freezed` classes or ARB files.

      - name: Analyze
        run: flutter analyze --fatal-infos

      # Rive file parsing in widget tests needs the rive_native host
      # library, which is not committed (build/ is gitignored).
      - name: Fetch rive_native host library
        run: dart run rive_native:setup --clean --platform linux

      - name: Test
        run: flutter test

  functions:
    name: Functions Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
        working-directory: functions

      - run: npm run lint
        working-directory: functions

      - run: npm run build
        working-directory: functions

      - run: npm test
        working-directory: functions
